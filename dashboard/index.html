<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: protocols with no token, ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="4"/><path d="M16 16 L28 9"/><circle class="blip" cx="23" cy="11" r="2.2"/></svg>
    <div><h1>Token Radar</h1><p id="sub">Protocols that record no token, valued the way the market already prices the ones that do.</p></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
</header>
<section class="stats" id="stats" aria-label="Board summary"></section>
<div class="layout" id="layout">
  <aside class="side" id="side" aria-label="Filters and model"></aside>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="detail" id="detail" aria-label="Protocol detail" hidden></aside>
</div>
<footer class="foot" id="foot"></footer>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
